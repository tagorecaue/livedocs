[project]
name = "livedocs"
version = "0.1.0"
description = "Living documentation for SaaS — interview-driven, code-aware, agent-powered"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
authors = [
    { name = "Tagore Cardoso" },
]
requires-python = ">=3.11"
keywords = ["documentation", "ai", "agent", "claude", "knowledge-base", "rag", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "questionary>=2.0.0",
    "pydantic>=2.6.0",
    "tomli-w>=1.0.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
    "platformdirs>=4.2.0",
]

[project.scripts]
livedocs = "livedocs.cli:app"

[project.urls]
Homepage = "https://github.com/tagorecardoso/livedocs"
Repository = "https://github.com/tagorecardoso/livedocs"
Issues = "https://github.com/tagorecardoso/livedocs/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["livedocs"]

[tool.hatch.build.targets.wheel.force-include]
"livedocs/skill/SKILL.md" = "livedocs/skill/SKILL.md"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]
